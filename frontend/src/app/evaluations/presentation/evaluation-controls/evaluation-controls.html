<div class="evaluation" role="group" [attr.aria-label]="label()" [attr.aria-busy]="!ready()" data-testid="evaluation-controls">
  <div class="evaluation__row">
    <div class="evaluation__score" role="group" aria-label="Puntuación">
      <button
        type="button"
        class="thumb thumb--up"
        aria-label="Bien"
        title="Bien"
        data-testid="score-up"
        [attr.aria-pressed]="score() === 1"
        [disabled]="!ready()"
        (click)="setScore(1)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7 11v9H4v-9h3zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-1.5 7a2 2 0 0 1-2 1.5H7" />
        </svg>
      </button>
      <button
        type="button"
        class="thumb thumb--down"
        aria-label="Mal"
        title="Mal"
        data-testid="score-down"
        [attr.aria-pressed]="score() === -1"
        [disabled]="!ready()"
        (click)="setScore(-1)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7 13V4H4v9h3zM7 13l4 8a2 2 0 0 0 2-2v-4h6a2 2 0 0 0 2-2l-1.5-7A2 2 0 0 0 17.5 4H7" />
        </svg>
      </button>
    </div>

    <div class="evaluation__tags">
      <ul class="chips" aria-label="Etiquetas" data-testid="evaluation-tags">
        @for (chip of chips(); track chip.text) {
          <li class="chip" data-testid="evaluation-tag">
            <lucia--filterchip [filterChip]="chip"></lucia--filterchip>
            <button type="button" class="chip__remove" [attr.aria-label]="'Quitar la Etiqueta ' + chip.text" (click)="removeTag(chip.text)">
              <span aria-hidden="true">✕</span>
            </button>
          </li>
        }
      </ul>
      <input
        type="text"
        class="tag-input"
        placeholder="Añadir Etiqueta"
        aria-label="Añadir Etiqueta"
        autocomplete="off"
        data-testid="tag-input"
        [attr.list]="datalistId"
        [disabled]="!ready()"
        (keydown)="onTagKeydown($event)"
        (blur)="onTagBlur($event)"
      />
      <datalist [id]="datalistId">
        @for (option of tagOptions(); track option) {
          <option [value]="option"></option>
        }
      </datalist>
    </div>

    <span class="evaluation__status" role="status" aria-live="polite" [attr.data-status]="status()" data-testid="evaluation-status">
      {{ statusLabels[status()] }}
    </span>
  </div>

  <textarea
    class="note"
    rows="2"
    placeholder="Nota: por qué esta Puntuación"
    aria-label="Nota"
    data-testid="evaluation-note"
    [value]="note()"
    [disabled]="!ready()"
    (input)="onNoteInput($event)"
    (blur)="onNoteBlur()"
  ></textarea>
</div>

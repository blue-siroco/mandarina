      type: object
      required: [type, description, duration_ms, internal]
      properties:
        type: { type: [string, 'null'], description: Tipo de Subagente. }
        description: { type: [string, 'null'], description: Descripción de la Tarea del Subagente. }
        duration_ms:
          type: [integer, 'null']

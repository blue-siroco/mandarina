      required: [session_id, project, subagent_id, tool_use_id, description, status, background, started_at, stopped_at, duration_ms, tool_count, tool_errors, blocks, model, tokens, estimated_cost_usd, cache_hit_rate, cache_savings_net_usd, result]
      properties:
        session_id: { type: string }
        project: { type: string }
        subagent_id: { type: [string, 'null'] }
        tool_use_id: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: Descripción de la Tarea del Subagente. }
        status: { $ref: '#/components/schemas/LaunchStatus' }
        background: { type: boolean }
        started_at: { type: string, format: date-time }
        stopped_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        tool_count: { type: integer, minimum: 0 }
        tool_errors: { type: integer, minimum: 0 }
        blocks: { type: integer, minimum: 0 }
        model: { type: [string, 'null'] }
        tokens:
          oneOf:
            - { $ref: '#/components/schemas/TokenUsage' }
            - { type: 'null' }
        estimated_cost_usd: { type: [number, 'null'] }
        cache_hit_rate: { type: [number, 'null'], minimum: 0, maximum: 1, description: Tasa de acierto de caché de este Lanzamiento; `null` sin Transcript (AC-73). }
        cache_savings_net_usd: { type: [number, 'null'], description: Ahorro neto por caché de este Lanzamiento; `null` sin Transcript (AC-73). }
        result: { type: [string, 'null'], description: Respuesta final resumida; `null` en marcha o sin Transcript. }
    AgentProfile:
      description: Perfil de un Tipo de Subagente (AC-46).
      type: object
      required: [summary, launched_by, models, tools, skills, mcp_servers, test_runs, launches]
      properties:
        summary: { $ref: '#/components/schemas/AgentTypeSummary' }
        launched_by:
          description: 'Quién lo lanza: `null` es el agente principal; un Tipo, la Sesión arrancada como ese agente o un Subagente que lanzó.'
          type: array
          items:
            type: object
            required: [launcher, launches]
            properties:
              launcher: { type: [string, 'null'] }
              launches: { type: integer, minimum: 1 }
        models:
          type: array
          items:
            type: object
            required: [model, launches]
            properties:
              model: { type: string }
              launches: { type: integer, minimum: 1 }
        tools:
          description: Herramientas que invocan sus Subagentes, por llamadas.
          type: array
          items:
            type: object
            required: [name, calls, errors, blocks]
            properties:
              name: { type: string }
              calls: { type: integer, minimum: 0 }
              errors: { type: integer, minimum: 0 }
              blocks: { type: integer, minimum: 0 }
        skills:
          type: array
          items:
            type: object
            required: [skill, invocations]
            properties:
              skill: { type: string }
              invocations: { type: integer, minimum: 1 }
        mcp_servers:
          type: array
          items:
            type: object
            required: [server, calls, errors]
            properties:
              server: { type: string }
              calls: { type: integer, minimum: 1 }
              errors: { type: integer, minimum: 0 }
        test_runs:
          type: object
          required: [total, passed, failed]
          properties:
            total: { type: integer, minimum: 0 }
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        launches:
          description: El más reciente primero; como máximo 500.
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AgentLaunch' }
    McpInvocationStatus:
      description: Estado de una invocación de Herramienta MCP (AC-41).
      type: string
      enum: [ok, error, interrupted, blocked, running, no_response]
    McpInvocation:
      description: Invocación de una Herramienta MCP (AC-41).
      type: object
      required: [id, event_id, project, directory, session_id, subagent_id, server, scope, tool, tool_name, summary, status, started_at, ended_at, duration_ms, response_bytes, has_image, error]
      properties:
        id: { type: string, description: Id del `tool.pre` (o del `tool.blocked`). }
        event_id: { type: string }
        project: { type: string }
        directory: { type: string }
        session_id: { type: string }
        subagent_id: { type: [string, 'null'], description: '`null` si la invocó el agente principal.' }
        server: { type: string }
        scope:
          type: [string, 'null']
          description: Ámbito de su configuración (`project`, `user`, `local`, `plugin`…); `null` si el Harness no lo envía.
        tool: { type: string, description: 'Nombre de la herramienta dentro del servidor (`browser_navigate`).' }
        tool_name: { type: string, description: 'Nombre completo (`mcp__playwright__browser_navigate`).' }
        summary: { type: [string, 'null'], description: Entrada resumida en una línea. }
        status: { $ref: '#/components/schemas/McpInvocationStatus' }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        response_bytes: { type: [integer, 'null'], minimum: 0, description: Bytes del JSON de `tool_response`; `null` sin respuesta. }
        has_image: { type: boolean }
        error: { type: [string, 'null'], description: Primera línea del error. }
    McpUsageStats:
      description: Cifras de uso de un Servidor MCP o de una de sus herramientas (AC-42).
      type: object
      required: [calls, ok, errors, interrupted, blocked, running, no_response, failure_rate, latency_p50_ms, latency_p95_ms, response_avg_bytes, response_max_bytes, has_image, last_at, sessions]
      properties:
        calls: { type: integer, minimum: 1 }
        ok: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        interrupted: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        no_response: { type: integer, minimum: 0 }
        failure_rate: { type: [number, 'null'], minimum: 0, maximum: 1, description: '`errors / (ok + errors)`; `null` si ninguna terminó.' }
        latency_p50_ms: { type: [integer, 'null'], minimum: 0 }
        latency_p95_ms: { type: [integer, 'null'], minimum: 0 }
        response_avg_bytes: { type: [integer, 'null'], minimum: 0 }
        response_max_bytes: { type: [integer, 'null'], minimum: 0 }
        has_image: { type: boolean }
        last_at: { type: string, format: date-time }
        sessions: { type: integer, minimum: 1 }
    McpToolUsage:
      description: Uso agregado de una Herramienta MCP (AC-42).
      allOf:
        - { $ref: '#/components/schemas/McpUsageStats' }
        - type: object
          required: [tool, tool_name]
          properties:
            tool: { type: string }
            tool_name: { type: string }
    McpServerUsage:
      description: Uso agregado de un Servidor MCP y de cada una de sus herramientas (AC-42).
      allOf:
        - { $ref: '#/components/schemas/McpUsageStats' }
        - type: object
          required: [server, scopes, projects, tools]
          properties:
            server: { type: string }
            scopes: { type: array, items: { type: string } }
            projects: { type: array, items: { type: string } }
            tools:
              description: Ordenadas por llamadas.
              type: array
              items: { $ref: '#/components/schemas/McpToolUsage' }
    ExportState:
      description: Estado de la Exportación OTLP de un Turno (ADR-0008).
      type: string
      enum: [pending, exported, failed]
    ExportedTurn:
      description: Un Turno y su Exportación OTLP (AC-52).
      type: object
      required: [turn_id, session_id, project, state, attempts, last_error, updated_at]
      properties:
        turn_id: { type: string, description: Id del `prompt.submitted` que abre el Turno. }
        session_id: { type: string }
        project: { type: string }
        state: { $ref: '#/components/schemas/ExportState' }
        attempts: { type: integer, minimum: 0 }
        last_error: { type: [string, 'null'], description: Último error del colector; `null` si no falló. }
        updated_at: { type: string, format: date-time }
    ExporterStatus:
      description: Estado de la Exportación OTLP (AC-52).
      type: object
      required: [enabled, endpoint_host, include_content, enabled_since, counts, last_exported_at, recent]
      properties:
        enabled: { type: boolean }
        endpoint_host:
          type: [string, 'null']
          description: Host (y puerto) del colector, sin ruta ni credenciales; `null` si está desactivado.
        include_content:
          type: boolean
          description: Si se exportan prompts y entradas y salidas de herramientas (`MANDARINA_OTLP_INCLUDE_CONTENT`).
        enabled_since:
          type: [string, 'null']
          format: date-time
          description: Desde cuándo exporta; los Turnos terminados antes no se exportan.
        counts:
          type: object
          required: [pending, exported, failed]
          properties:
            pending: { type: integer, minimum: 0 }
            exported: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        last_exported_at: { type: [string, 'null'], format: date-time }
        recent:
          description: Los 50 Turnos cambiados más recientemente, el más reciente primero.
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ExportedTurn' }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

        session_id: { type: [string, 'null'], description: 'La Sesión que cambió, en un Presupuesto por Sesión.' }
        action: { type: string, enum: [warn, stop] }
        state: { $ref: '#/components/schemas/BudgetState' }
        previous_state: { $ref: '#/components/schemas/BudgetState' }
        spent_usd: { type: number }
